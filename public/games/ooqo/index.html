<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="connect-src 'self'" />
    <title>Ooqo</title>
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #000;
        color: #fff;
        overflow: hidden;
      }
      canvas {
        display: block;
        outline: none;
        touch-action: none;
      }
      #status {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        gap: 16px;
        padding: 32px;
        text-align: center;
        font: 16px/1.5 sans-serif;
        background: #000;
      }
      #status[hidden] {
        display: none;
      }
      #status p {
        margin: 0;
      }
      #status button {
        border: 1px solid #ffffff60;
        border-radius: 99px;
        padding: 12px 24px;
        background: #fff;
        color: #111;
        font: inherit;
        cursor: pointer;
      }
    </style>
    <script src="./runtime/index.js" defer></script>
    <script src="./boot.js" defer></script>
  </head>
  <body>
    <canvas id="canvas" tabindex="0" aria-label="Ooqo 游戏"></canvas>
    <div id="status" role="status">
      <p id="status-text">正在加载 Ooqo…</p>
      <button id="resume" type="button" hidden>继续游戏</button>
    </div>
    <noscript>请启用 JavaScript 后游玩 Ooqo。</noscript>
  </body>
</html>
